name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    # Only run when someone actually writes "@claude" — but hand off PR
    # review requests (comments mentioning "@claude" + "review" on a PR)
    # to the review job instead, so we don't double-respond.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !(github.event.issue.pull_request != null && contains(github.event.comment.body, 'review'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Gate: only collaborators with write access or higher can invoke Claude.
      # This stops random outside users from triggering (and spending) Claude.
      - name: Check permission
        id: check-permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [ "$PERMISSION" = "admin" ] || [ "$PERMISSION" = "maintain" ] || [ "$PERMISSION" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "User ${{ github.actor }} authorized with '$PERMISSION' permission."
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::User ${{ github.actor }} has '$PERMISSION' permission, 'write' or higher required. Skipping."
          fi

      - name: Checkout repository
        if: steps.check-permission.outputs.authorized == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.check-permission.outputs.authorized == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: >-
            --allowed-tools
            "WebSearch,WebFetch,Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(ls:*),Bash(cd:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(echo:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*)"

  review:
    # Automatic review on every PR open/update, or on request via a PR
    # comment
