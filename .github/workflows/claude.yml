name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  claude:
    # Only run when someone actually writes "@claude" — but hand off PR
    # review requests (comments mentioning "@claude" + "review" on a PR)
    # to the review job instead, so we don't double-respond.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && !(github.event.issue.pull_request != null && contains(github.event.comment.body, 'review'))) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      # Gate: only collaborators with write access or higher can invoke Claude.
      # This stops random outside users from triggering (and spending) Claude.
      - name: Check permission
        id: check-permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [ "$PERMISSION" = "admin" ] || [ "$PERMISSION" = "maintain" ] || [ "$PERMISSION" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "User ${{ github.actor }} authorized with '$PERMISSION' permission."
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::User ${{ github.actor }} has '$PERMISSION' permission, 'write' or higher required. Skipping."
          fi

      - name: Checkout repository
        if: steps.check-permission.outputs.authorized == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code
        if: steps.check-permission.outputs.authorized == 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          # Allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: >-
            --allowed-tools
            "WebSearch,WebFetch,Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(ls:*),Bash(cd:*),Bash(cat:*),Bash(find:*),Bash(grep:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sort:*),Bash(uniq:*),Bash(diff:*),Bash(echo:*),Bash(mkdir:*),Bash(cp:*),Bash(mv:*)"

  review:
    # Automatic review on every PR open/update, or on request via a PR
    # comment containing "@claude" and "review" (e.g. "@claude, can you
    # review this PR?").
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, '@claude') && contains(github.event.comment.body, 'review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      # Same collaborator gate as the claude job above.
      - name: Check permission
        id: check-permission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PERMISSION=$(gh api repos/${{ github.repository }}/collaborators/${{ github.actor }}/permission --jq '.permission')
          if [ "$PERMISSION" = "admin" ] || [ "$PERMISSION" = "maintain" ] || [ "$PERMISSION" = "write" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
            echo "User ${{ github.actor }} authorized with '$PERMISSION' permission."
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
            echo "::notice::User ${{ github.actor }} has '$PERMISSION' permission, 'write' or higher required. Skipping review."
          fi

      - name: Determine PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.check-permission.outputs.authorized == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        if: steps.check-permission.outputs.authorized == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.pr.outputs.number }}

            Review this pull request against CLAUDE.md in this repository.

            If a skill's guidance touches design tokens or conventions that
            may have moved on, check eds.equinor.com for the current state.
            Note any difference as an informational aside at the end of your
            review, clearly separated from actionable findings — never as a
            blocking issue.

            Use `gh pr comment` for top-level feedback and
            `mcp__github_inline_comment__create_inline_comment` (confirmed: true)
            for line-specific issues.
          claude_args: '--allowedTools "Bash(gh pr:*),WebFetch(domain:eds.equinor.com),mcp__github_inline_comment__create_inline_comment"'
